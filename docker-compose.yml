version: '3.8'

services:
  bingo-bot:
    profiles: ["bot"]
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: kelem-bingo-bot
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
