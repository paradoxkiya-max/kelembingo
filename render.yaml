services:
  # ── Gateway: API + Engine + SQLite ──
  #
  # SECURITY: all tokens below are placeholders. Real values are set in the
  # Render dashboard (Environment) for each service and have been ROTATED after
  # being leaked in an earlier commit. Do NOT commit real bot tokens.
  - type: web
    name: kelembingo-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.gateway
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: RENDER_API_ONLY
        value: "true"
      # Exactly one Render service must own round progression.
      - key: GAME_ENGINE_ENABLED
        value: "true"
      # Additive reference-inspired room intents; set false for REST rollback.
      - key: ROOM_PROTOCOL_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_AUTH_SECRET
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: BACKUP_BOT_TOKEN
        sync: false
      - key: BACKUP_CHAT_ID
        sync: false
      - key: ADMIN_USERNAME
        value: "paradox"
      - key: ADMIN_PASSWORD
        sync: false
    autoDeploy: true

  # ── Bots: Telegram bot processes (cron — keeps polling alive on free tier) ──
  # Long-polling bots never exit, so Render stops the current run when the next
  # scheduled run begins (bots restart each interval). No HTTP health check.
  - type: cron
    name: kelembingo-bots
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.bot
    dockerContext: .
    schedule: "*/5 * * * *"
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: USE_GATEWAY
        value: "true"
      # Safety guard if this service ever imports the API module.
      - key: GAME_ENGINE_ENABLED
        value: "false"
      - key: GATEWAY_URL
        value: https://kelembingo-sqnv.onrender.com
      - key: WEBAPP_URL
        value: https://kelembingo-frontend-i8yy.onrender.com/
      - key: INTERNAL_API_KEY
        value: your_internal_api_key_here
      - key: BOT_TOKEN
        value: your_bot_token_here
      - key: ADMIN_BOT_TOKEN
        value: your_admin_bot_token_here
      - key: PAYMENT_BOT_TOKEN
        value: your_payment_bot_token_here
      - key: ADMIN_CHAT_ID
        value: "8462274722"
      - key: ADMIN_TALK_BOT_TOKEN
        value: your_admin_talk_bot_token_here
      - key: SUPPORT_BOT_TOKEN
        value: your_support_bot_token_here
      - key: ADMIN_SUPPORT_BOT_TOKEN
        value: your_admin_support_bot_token_here
    autoDeploy: true
