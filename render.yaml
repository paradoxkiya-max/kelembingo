services:
  # One service owns the gateway, Supabase/PostgreSQL connection, game engine,
  # Socket.IO API, and all configured Telegram polling workers.
  - type: web
    name: kelembingo
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: COMBINED_SERVICE
        value: "true"
      - key: USE_GATEWAY
        value: "false"
      - key: RENDER_API_ONLY
        value: "false"
      - key: GAME_ENGINE_ENABLED
        value: "true"
      - key: ROOM_PROTOCOL_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://kelembingo-frontend-i8yy-9m27.onrender.com
      - key: WEBAPP_URL
        value: https://kelembingo-frontend-i8yy-9m27.onrender.com/
      - key: INTERNAL_API_KEY
        sync: false
      - key: BOT_SERVICE_ID
        value: kelembingo-combined
      - key: ADMIN_AUTH_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_BOT_TOKEN
        sync: false
      - key: PAYMENT_BOT_TOKEN
        sync: false
      - key: SUPPORT_BOT_TOKEN
        sync: false
      - key: ADMIN_SUPPORT_BOT_TOKEN
        sync: false
      - key: ADMIN_TALK_BOT_TOKEN
        sync: false
      - key: BACKUP_BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: BACKUP_CHAT_ID
        sync: false
    autoDeploy: true
