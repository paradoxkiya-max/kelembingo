name: Validate Gateway

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: syntax-and-readiness-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Validate gateway modules
        run: python -m py_compile startup_state.py run_gateway.py api/admin_api.py firestore_db.py
      - name: Verify startup readiness gate
        run: python tools/test_startup_readiness.py
