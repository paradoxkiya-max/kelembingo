name: Validate Gateway

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: syntax-and-readiness-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Validate gateway modules
        run: python -m py_compile startup_state.py run_gateway.py api/admin_api.py firestore_db.py
      - name: Verify startup readiness gate
        run: python tools/test_startup_readiness.py
      - name: Verify SQLite query compatibility
        run: python tools/test_sqlite_query_adapter.py
      - name: Verify mobile game timer regression
        run: node --check dashboard/js/game-board.js && python tools/test_game_timer_regression.py && python tools/test_timer_schedule.py
      - name: Verify production database guard
        run: python tools/test_database_config_guard.py
      - name: Verify realtime and single-winner hardening
        run: node --check dashboard/js/firebase.js && node --check dashboard/js/game-board.js && python tools/test_realtime_winner_hardening.py
      - name: Verify stake-selection performance path
        run: node --check dashboard/js/page-loader.js && node --check dashboard/js/auth.js && node --check dashboard/js/card-select.js && node --check dashboard/js/rules.js && python tools/test_stake_selection_performance.py && python tools/test_public_stats_helper.py
