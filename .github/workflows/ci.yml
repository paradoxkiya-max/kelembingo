name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run focused contracts
        run: |
          python tools/test_deposit_datetime_serialization.py
          python tools/test_payment_datetime_serialization.py
          python tools/test_security_and_worker_contract.py
          python tools/test_database_config_guard.py
          python tools/test_startup_readiness.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-react
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard-react/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check frontend
        run: pnpm exec tsc --noEmit
      - name: Build frontend
        run: pnpm run build
