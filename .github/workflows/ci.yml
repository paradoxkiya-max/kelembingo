name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run focused contracts
        run: |
          python tools/test_deposit_datetime_serialization.py
          python tools/test_payment_datetime_serialization.py
          python tools/test_deposit_field_contract.py
          python tools/test_combined_service_ownership.py
          python tools/test_frontend_gateway_and_latency_contract.py
          python tools/test_admin_realtime_contract.py
          python tools/test_bot_performance_contract.py
          python tools/test_processing_message_contract.py
          python tools/test_wallet_flow_contract.py
          python tools/test_wallet_web_validation_contract.py
          python tools/test_bot_content_sync_contract.py
          python tools/test_bot_content_editor_contract.py
          python tools/test_room_protocol_contract.py
          python tools/test_room_protocol_runtime.py
          python tools/test_selection_wallet_reservation.py
          python tools/test_selection_join_contract.py
          python tools/test_selection_deadline_guard.py
          python tools/test_late_two_cartela_selection.py
          python tools/test_cross_player_cartela_realtime.py
          python tools/test_derash_display_accuracy.py
          python tools/test_security_and_worker_contract.py
          python tools/test_database_config_guard.py
          python tools/test_startup_readiness.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-react
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard-react/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check frontend
        run: pnpm exec tsc --noEmit
      - name: Build frontend
        run: pnpm run build
